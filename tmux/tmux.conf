# Ink Meridian · tmux
#
# Colour scheme for tmux, built on the Ink Meridian palette.
# Colours only — no key bindings, plugins, or mouse settings.
#
# Usage: source-file this, or add `source-file /path/to/tmux.conf` to your tmux.conf

# --- Terminal ---
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm-256color:RGB"

# --- Palette (ANSI 0-15) ---
set -g pane-colours[0] '#1A2233'
set -g pane-colours[1] '#DE6E7C'
set -g pane-colours[2] '#7CBF8E'
set -g pane-colours[3] '#D9B06E'
set -g pane-colours[4] '#6F96E8'
set -g pane-colours[5] '#A687E0'
set -g pane-colours[6] '#67B7CF'
set -g pane-colours[7] '#AAB8D0'
set -g pane-colours[8] '#58657F'
set -g pane-colours[9] '#EC8B97'
set -g pane-colours[10] '#9DD4A7'
set -g pane-colours[11] '#E9C78C'
set -g pane-colours[12] '#8DB0F2'
set -g pane-colours[13] '#BDA3EC'
set -g pane-colours[14] '#87CEE2'
set -g pane-colours[15] '#E6ECF7'

# --- Status bar ---
set -g status-style "fg=#CCD6EA,bg=#1A2233"
set -g status-left-style "fg=#83A8F2,bg=#1A2233"
set -g status-right-style "fg=#83A8F2,bg=#1A2233"
set -g status-left-length 40
set -g status-right-length 80
set -g status-interval 5

# --- Window status ---
set -g window-status-style "fg=#AAB8D0,bg=#1A2233"
set -g window-status-current-style "fg=#101623,bg=#8DB0F2,bold"
set -g window-status-activity-style "fg=#E9C78C,bg=#1A2233,bold"
set -g window-status-separator " "

# --- Messages ---
set -g message-style "fg=#101623,bg=#83A8F2,bold"
set -g message-command-style "fg=#101623,bg=#8DB0F2,bold"

# --- Panes & borders ---
set -g pane-border-style "fg=#26365A"
set -g pane-active-border-style "fg=#83A8F2"
set -g display-panes-active-colour "#83A8F2"
set -g display-panes-border-style "fg=#26365A"

# --- Copy mode & selection ---
set -g mode-style "fg=#101623,bg=#8DB0F2,bold"
set -g copy-mode-match-style "fg=#101623,bg=#E9C78C"
set -g copy-mode-current-match-style "fg=#101623,bg=#83A8F2,bold"
set -g copy-mode-mark-style "fg=#CCD6EA,bg=#26365A"

# --- Cursor & clock ---
set -g cursor-style "blinking-block"
set -g clock-mode-colour "#83A8F2"
