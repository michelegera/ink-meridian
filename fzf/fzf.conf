# Ink Meridian · fzf
# Install: copy to ~/.config/fzf/fzf.conf, or point FZF_DEFAULT_OPTS_FILE at this file.

# Every colour key supported by this fzf (verified against man fzf, fzf 0.74.5).
--color=fg:#CCD6EA,list-fg:#CCD6EA,selected-fg:#E6ECF7,preview-fg:#CCD6EA,bg:#101623,list-bg:#101623,selected-bg:#26365A,preview-bg:#1A2233,input-bg:#101623,header-bg:#101623,footer-bg:#101623,hl:#83A8F2,selected-hl:#8DB0F2,current-fg:#E6ECF7,current-bg:#26365A,current-hl:#83A8F2,border:#26365A,list-border:#26365A,preview-border:#26365A,input-border:#26365A,header-border:#26365A,footer-border:#26365A,label:#AAB8D0,list-label:#AAB8D0,preview-label:#AAB8D0,input-label:#AAB8D0,header-label:#8DB0F2,footer-label:#AAB8D0,prompt:#83A8F2,pointer:#8DB0F2,marker:#A687E0,spinner:#67B7CF,info:#58657F,header:#8DB0F2,query:#E6ECF7,disabled:#58657F,separator:#26365A,scrollbar:#26365A,gutter:#101623

--layout=reverse               # prompt at the top, matches listed below
--height=60%                   # use at most 60% of the terminal
--info=inline-right            # match counter on the right of the prompt line
--border=rounded               # rounded window frame
--border-label=" ink meridian "  # frame label
--marker="›"                   # multi-select marker
--pointer="❯"                  # current-line pointer
